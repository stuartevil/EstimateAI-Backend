# EstimateAI local development stack
services:
  db:
    image: postgres:16-alpine
    container_name: estimateai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: estimateai
      POSTGRES_PASSWORD: estimateai
      POSTGRES_DB: estimateai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimateai -d estimateai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estimateai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://estimateai:estimateai@db:5432/estimateai
      DEBUG: "false"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
